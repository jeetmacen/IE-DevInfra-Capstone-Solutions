apiVersion: apps/v1
kind: Deployment
metadata:
  name: project14-web
  namespace: project14
  labels:
    app: project14-web
    project: project14
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: project14-web
  template:
    metadata:
      labels:
        app: project14-web
        project: project14
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: web-content
          configMap:
            name: project14-web-content
