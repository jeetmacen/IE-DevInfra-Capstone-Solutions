---
- name: Install and verify the lab web server
  hosts: web
  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Publish the application page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: "<h1>Configured by Ansible on {{ inventory_hostname }}</h1>\n"
        mode: "0644"
    - name: Enable the web service
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started
    - name: Read the page on the managed host
      ansible.builtin.uri:
        url: http://127.0.0.1/
        return_content: true
      register: page
    - name: Require this host's page
      ansible.builtin.assert:
        that: "('Configured by Ansible on ' ~ inventory_hostname) in page.content"
